name: Release build

# Builds the itch.io and Poki zips on every push to main (so itch.io mirrors
# snails.se), on version tags (v1.2.3) and on demand, keeps them as workflow
# artifacts, and pushes the itch build with butler when the secrets
# BUTLER_API_KEY and ITCH_TARGET (user/game) are set.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-itch.mjs
      - run: node scripts/build-poki.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: snackmageddon-poki
          path: dist/snackmageddon-poki.zip
      - uses: actions/upload-artifact@v4
        with:
          name: snackmageddon-itch
          path: dist/snackmageddon-itch.zip
      - name: Push to itch.io
        if: ${{ env.BUTLER_API_KEY != '' && env.ITCH_TARGET != '' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          curl -sL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip -d butler && chmod +x butler/butler
          VERSION=$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)
          ./butler/butler push dist/snackmageddon-itch.zip "$ITCH_TARGET:html5" --userversion "$VERSION"
