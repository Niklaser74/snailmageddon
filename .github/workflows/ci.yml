name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determinism tests (Node, headless)
        run: npm test
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Browser tests under /snailmageddon/ (the game's path on snails.se)
        run: npm run test:browser
        env:
          PREFIX: /snailmageddon
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
